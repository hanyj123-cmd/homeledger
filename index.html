<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a5fd0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Home Ledger">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>Home Ledger</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <h1>Home Ledger <span class="sub">(우리집 장부)</span></h1>
    <button id="chip" class="chip warn" type="button">● Sign in (로그인 필요)</button>
  </header>

  <main id="view"><div class="card center muted">Loading… (불러오는 중)</div></main>

  <button id="fab" class="fab" type="button" aria-label="Add transaction (거래 추가)">+</button>

  <nav class="tabs" aria-label="Main">
    <button type="button" data-tab="txns" class="on"><span class="en">Transactions</span><span class="ko">거래</span></button>
    <button type="button" data-tab="accounts"><span class="en">Accounts</span><span class="ko">계좌</span></button>
    <button type="button" data-tab="import"><span class="en">Import</span><span class="ko">가져오기</span></button>
    <button type="button" data-tab="settings"><span class="en">Settings</span><span class="ko">설정</span></button>
  </nav>

  <div id="overlay" hidden></div>
  <div id="toast" class="toast" hidden></div>
</body>
</html>
