<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161a15" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Home Ledger">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <title>Home Ledger</title>
  <script>(function(){try{var t=localStorage.getItem("hl_theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);var z=parseFloat(localStorage.getItem("hl_scale"));if(z>0.7&&z<1.8)document.documentElement.style.setProperty("--ui-scale",String(z));var l=localStorage.getItem("hl_lang");if(l==="ko"||l==="en"){document.documentElement.setAttribute("data-lang",l);document.documentElement.setAttribute("lang",l);}}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="charts.css">
  <link rel="stylesheet" href="lock.css">
  <script src="https://accounts.google.com/gsi/client" defer></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <span id="logo" class="brand-logo"></span>
      <span class="brand-text"><b>Home Ledger</b><i>우리집 장부</i></span>
    </div>
    <div class="top-actions">
      <button id="print-btn" class="iconbtn" type="button" aria-label="Print report (보고서 인쇄)" title="Print report (보고서 인쇄)"></button>
      <button id="lang-btn" class="iconbtn langbtn" type="button" aria-label="Language (언어)" title="Language (언어)">한/A</button>
      <button id="theme-btn" class="iconbtn" type="button" aria-label="Theme (화면 모드)" title="Theme (화면 모드)"></button>
      <button id="chip" class="chip warn" type="button">● Sign in (로그인 필요)</button>
    </div>
  </header>

  <nav class="tabs" aria-label="Main">
    <button type="button" data-tab="summary" class="on"><span class="ico" data-ic="summary"></span><span class="lab"><span class="en">Summary</span><span class="ko">요약</span></span></button>
    <button type="button" data-tab="txns"><span class="ico" data-ic="ledger"></span><span class="lab"><span class="en">Ledger</span><span class="ko">거래</span></span></button>
    <button type="button" data-tab="reports"><span class="ico" data-ic="reports"></span><span class="lab"><span class="en">Reports</span><span class="ko">보고서</span></span></button>
    <button type="button" data-tab="plan"><span class="ico" data-ic="plan"></span><span class="lab"><span class="en">Plan</span><span class="ko">계획</span></span></button>
    <button type="button" data-tab="wealth"><span class="ico" data-ic="wealth"></span><span class="lab"><span class="en">Wealth</span><span class="ko">자산·부채</span></span></button>
    <button type="button" data-tab="accounts" data-sec="1"><span class="ico" data-ic="accounts"></span><span class="lab"><span class="en">Accounts</span><span class="ko">계좌</span></span></button>
    <button type="button" data-tab="import" data-sec="1"><span class="ico" data-ic="import"></span><span class="lab"><span class="en">Import</span><span class="ko">가져오기</span></span></button>
    <button type="button" data-tab="settings" data-sec="1"><span class="ico" data-ic="settings"></span><span class="lab"><span class="en">Settings</span><span class="ko">설정</span></span></button>
    <button type="button" id="tab-more" class="morebtn" aria-haspopup="true" aria-expanded="false"><span class="ico" data-ic="more"></span><span class="lab"><span class="en">More</span><span class="ko">더보기</span></span></button>
  </nav>

  <main id="view"><div class="card center muted">Loading… (불러오는 중)</div></main>

  <!-- 예전 떠 있는 버튼 (화면에는 나오지 않지만 기존 연결을 위해 남겨 둡니다) -->
  <button id="fab-scan" class="fab fab-scan" type="button" aria-label="Scan receipt (영수증 스캔)" hidden></button>
  <button id="fab" class="fab" type="button" aria-label="Add transaction (거래 추가)" hidden>+</button>

  <div id="drawer" class="drawer" hidden>
    <div class="drawer-scrim" id="drawer-scrim"></div>
    <aside class="drawer-panel" id="drawer-panel" role="dialog" aria-label="Details"></aside>
  </div>
  <div id="overlay" hidden></div>
  <div id="toast" class="toast" hidden></div>
</body>
</html>
